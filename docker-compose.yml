# Project Stranger — full stack in two containers, plus an optional dev-only
# database viewer.
#
#   docker compose up --build      # build + run
#   open http://localhost:3000     # the app
#   open http://localhost:8001/docs# API docs (direct to backend)
#   open http://localhost:8080     # live read-only DB browser (dev tool)
#
# Data persists in the named volume "backend-data" across restarts.

services:
  backend:
    build:
      context: ./backend
    image: pondr-backend
    restart: unless-stopped
    environment:
      # SQLite on the mounted volume (4 slashes = absolute path /data/stranger.db)
      DATABASE_URL: "sqlite:////data/stranger.db"
      # Uploaded photos (wins/instants) live alongside the DB on the volume.
      UPLOAD_DIR: "/data/uploads"
      # Override both of these outside local dev.
      SECRET_KEY: "${SECRET_KEY:-pondr-dev-secret-do-not-use-in-production}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin-dev-password}"
    volumes:
      - backend-data:/data
    ports:
      - "8001:8001"          # optional: direct access to the API + /docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty => same-origin relative API calls, proxied to backend by nginx.
        VITE_API_URL: ""
    image: pondr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

  # Dev-only convenience: a web-based SQLite browser pointed at the same
  # volume the backend writes to, so you can leave a tab open and refresh it
  # to see live data (submitted notes, wins, etc). Read-only mount, so it
  # can never corrupt or write-lock the file the backend is using. Bound to
  # 127.0.0.1 only: the DB has emails and password hashes in it, so this
  # must never be reachable from the LAN, unlike the app's own ports.
  # Not part of the app itself — safe to remove for a "production" story.
  db-viewer:
    image: coleifer/sqlite-web
    restart: unless-stopped
    command: ["sqlite_web", "-H", "0.0.0.0", "-x", "-r", "/data/stranger.db"]
    volumes:
      - backend-data:/data:ro
    ports:
      - "127.0.0.1:8080:8080"   # loopback-only: never reachable from the LAN
    depends_on:
      backend:
        condition: service_started

volumes:
  backend-data:
