# nginx serves the built React SPA and reverse-proxies API traffic to the
# FastAPI backend container, so the browser only ever talks to one origin
# (no CORS configuration needed).

upstream backend {
    server backend:8001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── API + FastAPI docs → backend ──
    # Trailing-slash-free proxy_pass preserves the original /api/... path.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health      { proxy_pass http://backend; }
    location = /docs        { proxy_pass http://backend; }
    location = /openapi.json { proxy_pass http://backend; }
    location /redoc         { proxy_pass http://backend; }

    # ── SPA: serve index.html for client-side routes ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
