<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stranger Logo Concepts</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 48px;
      background: #0c0a14;
      background-image:
        radial-gradient(ellipse at 50% 30%, rgba(180,140,255,0.06) 0%, transparent 70%),
        radial-gradient(ellipse at 30% 80%, rgba(200,160,100,0.04) 0%, transparent 60%);
      font-family: 'Switzer', sans-serif;
      color: #f0e6d3;
      min-height: 100vh;
    }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; margin-bottom: 12px; }
    h2 { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(240,230,211,0.35); margin: 48px 0 20px; font-family: 'JetBrains Mono', monospace; }
    .row { display: flex; gap: 48px; align-items: center; flex-wrap: wrap; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .item span { font-size: 0.7rem; color: rgba(240,230,211,0.3); font-family: 'JetBrains Mono', monospace; }
    .dark-bg { background: #0c0a14; padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); }
    .light-bg { background: #f5f3ee; padding: 24px; border-radius: 16px; }
    img { height: auto; }
  </style>
</head>
<body>
  <h1>Stranger — Logo Concepts</h1>
  <p style="color: rgba(240,230,211,0.5); margin-bottom: 8px;">7 options across 3 styles</p>

  <h2>1. Icon / Symbol Only</h2>
  <div class="row">
    <div class="item dark-bg">
      <img src="icon-jar.svg" width="96">
      <span>Jar with notes</span>
    </div>
    <div class="item dark-bg">
      <img src="icon-minimal.svg" width="96">
      <span>Minimal vessel</span>
    </div>
    <div class="item dark-bg">
      <img src="icon-circle.svg" width="96">
      <span>S monogram</span>
    </div>
  </div>

  <h2>2. Wordmark Only</h2>
  <div class="row">
    <div class="item dark-bg">
      <img src="wordmark-serif.svg" width="220">
      <span>Serif with amber glow line</span>
    </div>
    <div class="item dark-bg">
      <img src="wordmark-mono.svg" width="220">
      <span>Mono uppercase + dot accents</span>
    </div>
  </div>

  <h2>3. Icon + Wordmark Combo</h2>
  <div class="row">
    <div class="item dark-bg">
      <img src="combo-jar-wordmark.svg" width="260">
      <span>Jar + serif wordmark</span>
    </div>
    <div class="item dark-bg">
      <img src="combo-s-wordmark.svg" width="260">
      <span>S monogram + serif wordmark</span>
    </div>
  </div>
</body>
</html>
