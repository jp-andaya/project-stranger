<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Abstract bowl/vessel - two curved lines forming a vessel shape -->
  <circle cx="32" cy="34" r="22" fill="url(#glow2)" opacity="0.3"/>
  <!-- Left curve -->
  <path d="M16 22 Q12 36 16 50 Q20 58 32 58" stroke="#e8b468" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Right curve -->
  <path d="M48 22 Q52 36 48 50 Q44 58 32 58" stroke="#e8b468" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Single floating note -->
  <rect x="27" y="32" width="10" height="7" rx="1.5" fill="#e8b468" opacity="0.8" transform="rotate(-8 32 35.5)"/>
  <!-- Dot accents (fireflies) -->
  <circle cx="22" cy="18" r="1.5" fill="#e8b468" opacity="0.4"/>
  <circle cx="44" cy="16" r="1" fill="#e8b468" opacity="0.3"/>
  <circle cx="38" cy="12" r="1.2" fill="#c4a0ff" opacity="0.3"/>
  <defs>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8b468" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8b468" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
