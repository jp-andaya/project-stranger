<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- "Stranger" in serif style -->
  <text x="100" y="34" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-size="32" fill="#f0e6d3" letter-spacing="-1">Stranger</text>
  <!-- Subtle underline glow -->
  <line x1="40" y1="40" x2="160" y2="40" stroke="url(#wglow)" stroke-width="1"/>
  <defs>
    <linearGradient id="wglow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8b468" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8b468" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8b468" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
